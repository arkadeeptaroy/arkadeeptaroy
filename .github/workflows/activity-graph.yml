name: Refresh contribution activity
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/activity-graph.mjs'
      - '.github/workflows/activity-graph.yml'

permissions:
  contents: write

concurrency:
  group: profile-activity
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate activity graph
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GRAPH_USER: ${{ github.repository_owner }}
        run: node scripts/activity-graph.mjs
      - name: Commit updated graph
        run: |
          if git diff --quiet -- assets/activity-graph.svg; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/activity-graph.svg
          git commit -m "Refresh contribution activity"
          git pull --rebase origin main
          git push origin HEAD:main
